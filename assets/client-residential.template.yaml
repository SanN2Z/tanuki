# SOCKS5 starting point; set the provider's actual port, auth and TLS support.
mixed-port: 17890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: true
external-controller: ""
find-process-mode: off
geo-auto-update: false
tun:
  enable: false
dns:
  enable: true
  listen: 127.0.0.1:11053
  enhanced-mode: redir-host
  ipv6: true
  respect-rules: true
  default-nameserver: ["{{BOOTSTRAP_DNS}}"]
  proxy-server-nameserver: ["{{BOOTSTRAP_DNS}}"]
  nameserver: ["https://1.1.1.1/dns-query#JP"]
proxies:
  - name: JP-RESIDENTIAL
    type: socks5
    server: "{{RESIDENTIAL_HOST}}"
    port: 1080
    username: "{{RESIDENTIAL_USER}}"
    password: "{{RESIDENTIAL_PASSWORD}}"
    tls: false
    udp: false
proxy-groups:
  - name: JP
    type: select
    proxies: [JP-RESIDENTIAL]
rules:
  - MATCH,JP
